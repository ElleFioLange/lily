<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hydra Output</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' http: https:; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; media-src: https: http:; style-src 'self' 'unsafe-inline'; img-src * 'self' blob: data: https:"
    />
    <link rel="stylesheet" type="text/css" href="src/assets/main.css" />
    <style>
      @keyframes trigger {
        0% {
          text-shadow:
            1px 1px 0px var(--color-stone-50),
            -1px 1px 0px var(--color-stone-50),
            -1px 1px 0px var(--color-stone-50),
            -1px -1px 0px var(--color-stone-50) !important;
        }
        20% {
          text-shadow:
            4px 4px 16px var(--color-stone-50),
            -4px 4px 16px var(--color-stone-50),
            -4px 4px 16px var(--color-stone-50),
            -4px -4px 16px var(--color-stone-50) !important;
        }
        100% {
          text-shadow:
            32px 32px 16px #00000000,
            -32px 32px 16px #00000000,
            -32px 32px 16px #00000000,
            -32px -32px 16px #00000000 !important;
        }
      }

      #text-overlay-container {
        scrollbar-color: #00000000 #00000000;
      }

      .keyword {
        font-family: Monaspace Krypton;
        font-weight: 600;
      }

      /* Audio-reactive keyword container */
      .keyword-container {
        position: relative;
        display: inline-block;
      }

      /* Keyword text (visible underneath shader) */
      .keyword-text {
        position: relative;
        z-index: 1;
        font-family: Monaspace Krypton;
        font-weight: 600;
        color: #00000000;
      }

      /* Shader canvas overlay */
      .keyword-shader {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        /* Blend mode set dynamically per effect preset */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.global = window
    </script>
    <script type="module" src="/src/hydra-popup.tsx"></script>
  </body>
</html>
