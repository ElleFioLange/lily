<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hydra Output</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link rel="stylesheet" type="text/css" href="src/assets/base.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        background: #000;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #text-overlay-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: auto;
        scrollbar-color: #00000000 #00000000;
      }

      #text-overlay {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        text-align: center;
        font-family: Monospace Xenon;
        color: #fafaf9; /* stone-100 */
        font-size: 48px; /* Default body font size */
        pointer-events: none; /* Allow clicks to pass through to canvas */
        z-index: 10;
        padding: 2rem; /* Add padding for text wrapping */
        word-wrap: break-word;
        white-space: pre-wrap; /* Preserve newlines and whitespace */
      }
    </style>
  </head>
  <body>
    <canvas id="hydra-canvas"></canvas>
    <div id="text-overlay-container">
      <div id="text-overlay"></div>
    </div>
    <script>
      window.global = window
    </script>
    <script type="module" src="/src/hydra-popup.ts"></script>
  </body>
</html>
